name: publish-runtime-artifact
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  publish:
    runs-on: asgard-build-1
    env:
      GITEA_SERVER_URL: ${{ github.server_url }}
      GITEA_OWNER: ${{ vars.DEVSPACE_PACKAGE_OWNER }}
    # Gitea administrators must define this digest from the approved Node 24
    # image catalog; an unpinned fallback is intentionally not provided.
    container: node:24-bookworm@sha256:${{ vars.NODE24_BOOKWORM_AMD64_DIGEST }}
    steps:
      - uses: actions/checkout@v4
      - name: Install test system dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends tmux
          rm -rf /var/lib/apt/lists/*
          chown -R node:node "$GITHUB_WORKSPACE"
      - name: Validate and build as unprivileged user
        run: |
          runuser --user node -- bash -lc '
            set -Eeuo pipefail
            cd "$GITHUB_WORKSPACE"
            npm ci
            npm test
            npm run typecheck
            npm run build:check
          '
      - name: Package deterministic artifact
        id: package
        run: |
          runuser --user node -- bash -lc '
            set -Eeuo pipefail
            cd "$GITHUB_WORKSPACE"
            export OUTPUT_DIR="$GITHUB_WORKSPACE/.artifacts"
            npm run package:runtime-artifact -- "$GITHUB_SHA"
            archive=".artifacts/devspace-linux-amd64-${GITHUB_SHA}.tar.gz"
            OUTPUT_DIR="$GITHUB_WORKSPACE/.artifacts-repeat" npm run package:runtime-artifact -- "$GITHUB_SHA"
            cmp "$archive" ".artifacts-repeat/devspace-linux-amd64-${GITHUB_SHA}.tar.gz"
            (cd "$(dirname "$archive")" && sha256sum --check "$(basename "$archive").sha256")
          '
          archive=".artifacts/devspace-linux-amd64-${GITHUB_SHA}.tar.gz"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Publish immutable Generic Package
        shell: bash
        env:
          PACKAGE_TOKEN: ${{ secrets.DEVSPACE_PACKAGE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PACKAGE_TOKEN"
          archive="devspace-linux-amd64-${GITHUB_SHA}.tar.gz"
          base="${GITEA_SERVER_URL}/api/packages/${GITEA_OWNER}/generic/devspace/${GITHUB_SHA}"
          for file in "$archive" "${archive}.sha256"; do
            status=$(curl --silent --show-error -H "Authorization: token $PACKAGE_TOKEN" \
              --output /tmp/existing-package-object --write-out '%{http_code}' "$base/$file")
            case "$status" in
              200) cmp -- ".artifacts/$file" /tmp/existing-package-object ;;
              404) curl --fail --silent --show-error -H "Authorization: token $PACKAGE_TOKEN" \
                --upload-file ".artifacts/$file" "$base/$file" ;;
              *) echo "unexpected package preflight status for $file: $status" >&2; exit 1 ;;
            esac
          done
      - name: Read back and verify published artifact
        id: published
        shell: bash
        env:
          PACKAGE_TOKEN: ${{ secrets.DEVSPACE_PACKAGE_TOKEN }}
        run: |
          set -Eeuo pipefail
          archive="devspace-linux-amd64-${GITHUB_SHA}.tar.gz"
          base="${GITEA_SERVER_URL}/api/packages/${GITEA_OWNER}/generic/devspace/${GITHUB_SHA}"
          mkdir -p /tmp/devspace-published
          curl --fail --silent --show-error -H "Authorization: token $PACKAGE_TOKEN" "$base/$archive" -o "/tmp/devspace-published/$archive"
          curl --fail --silent --show-error -H "Authorization: token $PACKAGE_TOKEN" "$base/${archive}.sha256" -o "/tmp/devspace-published/${archive}.sha256"
          cmp -- ".artifacts/$archive" "/tmp/devspace-published/$archive"
          cmp -- ".artifacts/${archive}.sha256" "/tmp/devspace-published/${archive}.sha256"
          (cd /tmp/devspace-published && sha256sum --check "${archive}.sha256")
          digest=$(awk '{print $1}' ".artifacts/${archive}.sha256")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Dispatch exact artifact deployment
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_REPOSITORY: ${{ github.repository }}
          ARCHIVE_SHA256: ${{ steps.published.outputs.digest }}
        run: |
          set -Eeuo pipefail
          test -n "$GITEA_TOKEN"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          curl --fail --silent --show-error \
            --header "Authorization: token ${GITEA_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"ref":"main","inputs":{"source_commit":"'"${GITHUB_SHA}"'","archive_sha256":"'"${ARCHIVE_SHA256}"'"}}' \
            "${GITEA_SERVER_URL}/api/v1/repos/${GITEA_REPOSITORY}/actions/workflows/deploy-runtime-artifact.yml/dispatches"
